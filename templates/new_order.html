<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rads Gas - New Order</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f4;margin:0;padding:0}
.header{background:#0e8a4c;color:white;padding:18px;text-align:center}
.card{background:white;margin:15px;padding:20px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{background:#ff7a00;color:white;padding:14px;width:100%;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
a{color:#0e8a4c;text-decoration:none}
</style>
</head>
<body>
<div class="header"><h2>RADS GAS</h2><div>Fast • Safe • Reliable Gas Delivery</div></div>
<div class="card">
<h3>🔥 New Order</h3>
<p>Cape Town Delivery</p>
<form action="/place_order" method="POST">
<label>Name</label>
<input name="customer" placeholder="Azhar" required>
<label>Phone</label>
<input name="phone" placeholder="074..." required>
<label>Address</label>
<input name="address" placeholder="20 Poplar..." required>
<label>Size</label>
<select name="size">
<option>5kg - R200</option>
<option>9kg - R320</option>
<option>14kg - R510</option>
<option>19kg - R710</option>
<option>48kg - R1750</option>
</select>
<label>Qty</label>
<input type="number" name="qty" value="1" min="1">
<br><br>

</form>
<br>
<a href="/">← Back to Dashboard</a>
<script>
function whatsappOrder(e){
let size = document.querySelector('select[name="size"]')?.value || document.querySelector('select').value;
let qty = document.querySelector('input[name="qty"]').value;
let name = document.querySelector('input[name="customer"]')?.value || document.querySelector('input[name="customer_name"]')?.value;
let phone = document.querySelector('input[name="phone"]').value;
let address = document.querySelector('input[name="address"]').value;

fetch("https://script.google.com/macros/s/AKfycbzgd-B0DKlgHguTRxuxcp8T5nj7poSVNReSc41rKXSsSBAn_UndmLSlJURj3yJlZYD6Xg/exec", {
method:"POST",
mode:"no-cors",
body:JSON.stringify({name:name, phone:phone, address:address, size:size, price:qty})
});

let msg=`NEW RADS GAS ORDER%0A%0ASize: ${size}%0AQty: ${qty}%0AName: ${name}%0APhone: ${phone}%0AAddress: ${address}`;
window.open(`https://wa.me/27746888347?text=${msg}`, '_blank');
}
document.querySelector('form').addEventListener('submit', function(e){
e.preventDefault();
whatsappOrder(e);
setTimeout(()=>{e.target.submit();}, 1000);
});
</script>
</body>
</html>
