<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rads Gas - New Order</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
.header{background:#1a5c2a;color:white;padding:20px;text-align:center}
.form-box{background:white;margin:20px;padding:20px;border-radius:12px}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
button{background:#1a5c2a;color:white;padding:14px;width:100%;border:none;border-radius:8px;font-size:18px}
</style>
</head>
<body>
<div class="header">
<h2>RADS GAS</h2>
<p>Fast • Safe • Reliable Gas Delivery</p>
</div>
<div class="form-box">
<h3>🔥 New Order - Cape Town Delivery</h3>
<form id="orderForm">
<input name="name" id="name" placeholder="Name" required>
<input name="phone" id="phone" placeholder="074..." required>
<input name="address" id="address" placeholder="20 Poplar..." required>
<label>Gas Size</label>
<select name="size" id="size" required>
<option value="5kg">5KG - R200</option>
<option value="9kg">9KG - R320</option>
<option value="14kg">14KG - R510</option>
<option value="19kg">19KG - R710</option>
<option value="48kg">48KG - R1750</option>
</select>
<label>Quantity</label>
<select name="qty" id="qty">
<option>1</option><option>2</option><option>3</option>
</select>
<button type="submit">Place Order - Pay on Delivery</button>
</form>
<p id="status"></p>
</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8avwSyrALLlpKXwJfDNdNuCWe_OFvcyy-nUVGquJjzo98UZnj-w938tic8OrC837nfw/exec";
const prices = {"5kg":200,"9kg":320,"14kg":510,"19kg":710,"48kg":1750};

document.getElementById('orderForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const address = document.getElementById('address').value;
  const size = document.getElementById('size').value;
  const qty = document.getElementById('qty').value;
  const price = prices[size]*qty;

  document.getElementById('status').innerText = "Saving...";

   // 1. Save to Google Sheet - FIXED
try{
  const formData = new URLSearchParams();
  formData.append('name', name);
  formData.append('phone', phone);
  formData.append('address', address);
  formData.append('size', size);
  formData.append('price', price);
  formData.append('qty', qty);
  await fetch(GOOGLE_SCRIPT_URL, {
    method:'POST',
    mode:'no-cors',
    body: formData
  });
}catch(err){ console.log(err); }

  // 2. Save to Flask (so stock goes down)
  try{
    await fetch('/place_order', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: `name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&address=${encodeURIComponent(address)}&size=${encodeURIComponent(size)}&qty=${encodeURIComponent(qty)}`
    });
  }catch(err){}

  // 3. WhatsApp you
  const msg = `NEW GAS ORDER%0AName: ${name}%0APhone: ${phone}%0AAddress: ${address}%0ASize: ${size}%0AQty: ${qty}%0APrice: R${price}`;
  window.open(`https://wa.me/27746888347?text=${msg}`, '_blank');

  // 4. Go to dashboard
  window.location.href = "/";
});
</script>
</body>
</html>
